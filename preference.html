<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trombinoscope Promo ENI</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="preferences.js" defer></script>
</head>

<body>
    <section class="en-tete">
        <img src="ressources/logo.png" alt="logo de la formation">
        <h1>Promo EDWM2605FT</h1>
        <div class="nav-affichage">
            <nav>
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="preference.html">Préférences</a></li>
                    <li><a href="carte.html">Carte</a></li>
                    <li><a href="informations.html">Informations</a></li>

                </ul>
            </nav>
        </div>
    </section>

    <section class="mid-page-pref">
        <main>
            <h2>Préférences du site</h2>
            <form>
                <div class="inputs">
                    <label for="theme">Thème du site</label>
                    <select id="theme" name="theme">
                        <option value="clair" selected>Clair</option>
                        <option value="sombre">Sombre</option>
                    </select>
                </div>

                <div class="inputs">
                    <p>Format d'affichage de la liste des apprenants </p>
                    <input type="radio" name="affichage" id="liste" value="liste" checked>
                    <div class="deuxBtns"><label for="liste">Liste</label>
                        <input type="radio" name="affichage" id="carte" value="carte">
                        <label for="carte">Cartes</label>
                    </div>
                </div>
            </form>
        </main>
    </section>

    <section class="buttons">
        <a class="button" href="index.html">Retour à la page d'accueil</a>
        <button type="button" class="button" id="save">Enregistrer</button>
    </section>

</body>
